name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff mypy
      - name: Lint (ruff)
        run: ruff check backend
      - name: Type check (mypy)
        working-directory: backend
        run: mypy app --ignore-missing-imports
      - name: Unit and integration tests (pytest)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint (oxlint)
        run: npx --yes oxlint@1.90.0 frontend/js e2e
      - name: Syntax check every module (no bundling step)
        run: find frontend/js e2e -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

  e2e:
    name: End-to-end (Chrome)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the browser journey and responsive matrix
        env:
          PYTHON: python
          CHROME_PATH: /usr/bin/google-chrome
          CHROME_ARGS: --no-sandbox
        run: node e2e/run.mjs
      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/output/
          retention-days: 7
